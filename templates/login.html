<!DOCTYPE html>
<html>

<head>
    <title>RemoteCam Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            background:
                radial-gradient(circle at top left, #2563eb, #0f172a 40%),
                #020617;

            color: white;
        }

        .bg {
            position: absolute;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(50px);
        }

        .box {

            width: 360px;

            padding: 40px;

            border-radius: 25px;

            background: rgba(30, 41, 59, .65);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, .08);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .6);
        }

        .logo {
            font-size: 60px;
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 8px;
        }

        p {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-top: 15px;

            border: none;

            outline: none;

            border-radius: 12px;

            background: #334155;

            color: white;
        }

        input:focus {

            border: 1px solid #3b82f6;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 16px;

            transition: .3s;
        }

        button:hover {

            transform: translateY(-2px);

            background: #3b82f6;
        }

        .error {

            margin-top: 18px;

            text-align: center;

            color: #f87171;
        }
    </style>

</head>

<body>

    <div class="bg"></div>

    <div class="box">

        <div class="logo">
            🎥
        </div>

        <h2>RemoteCam</h2>

        <p>Secure camera access portal</p>

        <form method="POST">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">

                Access Camera

            </button>

        </form>

        {% if error %}
        <div class="error">

            {{ error }}

        </div>
        {% endif %}

    </div>

</body>

</html>
