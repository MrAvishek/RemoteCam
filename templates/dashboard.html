<!DOCTYPE html>
<html>

<head>

    <title>RemoteCam Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI, Arial;
        }

        body {

            background: #020617;
            color: white;
        }

        .topbar {

            height: 75px;

            padding: 0 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: #0f172a;

            border-bottom: 1px solid rgba(255, 255, 255, .05);
        }

        .left {

            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {

            font-size: 28px;
        }

        .title {

            font-size: 22px;
            font-weight: bold;
        }

        .logout {

            text-decoration: none;

            padding: 10px 20px;

            border-radius: 10px;

            background: #dc2626;

            color: white;

            transition: .3s;
        }

        .logout:hover {

            background: #ef4444;
        }

        .wrapper {

            padding: 30px;
        }

        .card {

            background: #0f172a;

            padding: 25px;

            border-radius: 25px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .4);
        }

        .status {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 20px;

            color: #22c55e;
        }

        .dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: #22c55e;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0% {
                opacity: .3;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.3);
            }

            100% {
                opacity: .3;
                transform: scale(.9);
            }
        }

        img {

            width: 100%;

            max-height: 80vh;

            object-fit: cover;

            border-radius: 20px;

            border: 3px solid #1e293b;
        }

        .footer {

            margin-top: 20px;

            color: #64748b;

            font-size: 14px;
        }
    </style>

</head>

<body>

    <div class="topbar">

        <div class="left">

            <div class="logo">
                🎥
            </div>

            <div class="title">
                RemoteCam
            </div>

        </div>

        <a href="/logout" class="logout" id="logoutBtn">

            Logout

        </a>

    </div>

    <div class="wrapper">

        <div class="card">

            <div class="status">

                <div class="dot"></div>

                Camera Online

            </div>

            <img id="videoStream" src="{{ url_for('video_feed') }}">

            <div class="footer">

                Secure Remote Camera Monitoring System

            </div>

        </div>

    </div>

    <script>

        const logoutBtn =
            document.getElementById(
                'logoutBtn'
            )

        const video =
            document.getElementById(
                'videoStream'
            )

        logoutBtn.addEventListener(
            'click',
            () => {

                video.src = ''

            })

    </script>

</body>

</html>
