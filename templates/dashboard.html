<!DOCTYPE html>
<html>

<head>
    <title>Live Camera Feed</title>

    <style>
        body {
            margin: 0;
            background: #020617;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #0f172a;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
        }

        .logout {
            text-decoration: none;
            background: #dc2626;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .camera-container {
            margin-top: 30px;
        }

        img {
            width: 85%;
            max-width: 1000px;
            border-radius: 15px;
            border: 4px solid #1e293b;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .status {
            margin-top: 15px;
            color: #22c55e;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="title">Live Camera Monitoring</div>
        <a href="/logout" class="logout" id="logoutBtn">Logout</a>
    </div>

    <div class="camera-container">
        <img id="videoStream" src="{{ url_for('video_feed') }}">

        <div class="status">
            ● Camera Online
        </div>
    </div>

    <script>
        const logoutBtn = document.getElementById('logoutBtn');
        const video = document.getElementById('videoStream');

        logoutBtn.addEventListener('click', () => {
            video.src = '';
        });
    </script>

</body>

</html>
